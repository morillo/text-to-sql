[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Model-Agnostic Text-to-SQL Agent"
requires-python = ">=3.11"
dependencies = ["openai", "ipython", "pandas", "pydantic", "python-dotenv"]

[tool.uv]
# Not a distributable package: `uv sync` installs the dependencies only.
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]

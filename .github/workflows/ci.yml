name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: Pyright type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Pyright (same checks as VS Code Pylance)
        run: uv run pyright
